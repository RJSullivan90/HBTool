#
# Builds HBTool for macOS and Windows and publishes to GitHub Releases.
#
# Triggered by pushing a version tag:
#
#     npm version patch      # bumps package.json and creates the tag
#     git push --follow-tags
#
# Each runner builds its own platform because electron-builder needs the native
# toolchain: a macOS .dmg cannot be produced on Windows and vice versa.
#
# GITHUB_TOKEN is provided automatically and is scoped to this repository, so no
# secret needs configuring for the publish step.
#
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      # ONE AT A TIME. Serialisation alone was NOT enough: electron-builder's
      # publisher refuses to append to an already-published release, so on
      # v0.2.0 the second runner created a duplicate even though it ran after
      # the first — and GitHub's tag-based download URLs then resolved against
      # only one of the pair, 404ing the other platform's updater. That is why
      # publishing below is done with `gh release upload` instead of
      # electron-builder's publisher: create-if-absent, then upload by tag, is
      # deterministic. The serialisation stays so create-then-upload cannot
      # race either.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A missing bundle would produce an app that silently has no imagery, so
      # fail loudly here instead.
      - name: Verify the encrypted secrets bundle is present
        shell: bash
        run: test -s secrets/secrets.enc.json

      # electron-builder names the release from package.json, NOT from the git
      # tag. When they disagree, the build publishes onto the OLD version's
      # release: v0.1.1 and v0.2.0 both silently overwrote the v0.1.0 assets,
      # no new release appeared, and auto-update saw "0.1.0 == 0.1.0, nothing
      # to do". Fail the build instead of shipping that confusion.
      - name: Verify the tag matches package.json version
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json $PKG — bump with 'npm version' before tagging."
            exit 1
          fi

      - name: Build
        run: npm run ${{ matrix.script }} -- --publish never

      # Explicit upload instead of electron-builder's publisher — see the
      # max-parallel comment. --clobber makes a re-run of a failed job safe.
      - name: Upload to the tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "${TAG#v}" --notes "HBTool ${TAG#v}"
          shopt -s nullglob
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release/*.dmg release/*.zip release/*.exe release/*.blockmap release/latest*.yml
