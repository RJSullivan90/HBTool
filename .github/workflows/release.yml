#
# Builds HBTool for macOS and Windows and publishes to GitHub Releases.
#
# Triggered by pushing a version tag:
#
#     npm version patch      # bumps package.json and creates the tag
#     git push --follow-tags
#
# Each runner builds its own platform because electron-builder needs the native
# toolchain: a macOS .dmg cannot be produced on Windows and vice versa.
#
# GITHUB_TOKEN is provided automatically and is scoped to this repository, so no
# secret needs configuring for the publish step.
#
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      # ONE AT A TIME, deliberately. Run in parallel, both runners call
      # electron-builder --publish at the same moment, neither sees a release
      # for the tag yet, and each creates its own — producing TWO GitHub
      # releases sharing one tag. That happened on v0.1.0: the Mac artifacts
      # and the Windows artifacts landed on different releases, so one
      # platform's update manifest (latest.yml / latest-mac.yml) was missing
      # from whichever release resolved as "latest". Serialised, the first
      # runner creates the release and the second finds it by tag and appends.
      # Costs a few minutes of wall clock; buys a release that is correct.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A missing bundle would produce an app that silently has no imagery, so
      # fail loudly here instead.
      - name: Verify the encrypted secrets bundle is present
        shell: bash
        run: test -s secrets/secrets.enc.json

      # electron-builder names the release from package.json, NOT from the git
      # tag. When they disagree, the build publishes onto the OLD version's
      # release: v0.1.1 and v0.2.0 both silently overwrote the v0.1.0 assets,
      # no new release appeared, and auto-update saw "0.1.0 == 0.1.0, nothing
      # to do". Fail the build instead of shipping that confusion.
      - name: Verify the tag matches package.json version
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json $PKG — bump with 'npm version' before tagging."
            exit 1
          fi

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.script }} -- --publish always
